<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .mono { font-family: 'Consolas', 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; }
      .text-primary { fill: #e2e8f0; }
      .text-secondary { fill: #94a3b8; }
      .text-accent { fill: #7c3aed; }
      .text-high { fill: #22c55e; }
      .text-low { fill: #64748b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#1e1e2e"/>

  <!-- Title bar -->
  <!-- Component: <GpioMonitor /> -->
  <rect x="0" y="0" width="800" height="44" fill="#2a2a3e"/>
  <text x="20" y="28" class="sans text-primary" font-size="16" font-weight="bold">GPIO Monitor</text>
  <text x="600" y="28" class="sans text-secondary" font-size="12">23 pins | 12 out, 11 in</text>

  <!-- GPIO Grid: 4 columns x 6 rows -->
  <!-- Each cell is 180x80, with 12px gaps -->
  <!-- Column positions: 20, 208, 396, 584 -->
  <!-- Row positions: 56, 144, 232, 320, 408, 496 -->

  <!-- === Row 0: GP0-GP3 (Outputs) === -->
  <!-- Component: <PinCell pin="GP0" direction="output" state="HIGH" pull="none" /> -->
