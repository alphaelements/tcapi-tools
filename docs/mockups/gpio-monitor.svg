    <rect width="180" height="80" fill="#2a2a3e" rx="6" stroke="#7c3aed" stroke-width="2"/>
    <text x="12" y="24" class="mono text-primary" font-size="16" font-weight="bold">GP0</text>
    <text x="60" y="24" class="sans text-accent" font-size="11" font-weight="bold">OUT</text>
    <!-- Direction arrow: output -->
    <text x="100" y="24" class="sans text-accent" font-size="14">&#x2192;</text>
    <!-- State indicator -->
    <circle cx="152" cy="18" r="12" fill="#22c55e"/>
    <text x="12" y="52" class="mono text-high" font-size="18" font-weight="bold">HIGH</text>
    <text x="12" y="70" class="sans text-secondary" font-size="10">No pull</text>
  </g>

  <!-- Component: <PinCell pin="GP1" direction="output" state="LOW" pull="none" /> -->
