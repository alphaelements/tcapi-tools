<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <style>
      .mono { font-family: 'Consolas', 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; }
      .text-primary { fill: #e2e8f0; }
      .text-secondary { fill: #94a3b8; }
      .text-accent { fill: #7c3aed; }
      .text-high { fill: #22c55e; }
      .text-low { fill: #64748b; }
      .text-warn { fill: #ef4444; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="#1e1e2e"/>

  <!-- Title bar -->
  <!-- Component: <DevicePanel /> -->
  <rect x="0" y="0" width="400" height="44" fill="#2a2a3e"/>
  <text x="20" y="28" class="sans text-primary" font-size="16" font-weight="bold">Devices</text>
  <text x="320" y="28" class="sans text-accent" font-size="12" cursor="pointer">Refresh</text>

  <!-- ==================== Device List ==================== -->
  <!-- Component: <DeviceList devices={devices} selectedId="device1" /> -->

  <!-- Device 1 (selected, connected) -->
  <!-- Component: <DeviceCard device={device1} selected={true} connected={true} /> -->
  <rect x="12" y="56" width="376" height="96" fill="#2a2a3e" rx="8" stroke="#7c3aed" stroke-width="2"/>
  <rect x="12" y="56" width="4" height="96" fill="#22c55e" rx="2"/>

  <!-- Connected indicator -->
  <circle cx="32" cy="76" r="6" fill="#22c55e"/>
  <text x="44" y="80" class="sans text-primary" font-size="13" font-weight="bold">Pochi-DIO #1</text>
  <text x="300" y="80" class="sans text-high" font-size="11">Connected</text>

  <text x="28" y="100" class="sans text-secondary" font-size="10">UID</text>
  <text x="60" y="100" class="mono text-primary" font-size="10">D5B305543EC559BF</text>
  <text x="28" y="116" class="sans text-secondary" font-size="10">Port</text>
  <text x="60" y="116" class="mono text-primary" font-size="10">/dev/ttyACM0</text>
  <text x="220" y="116" class="sans text-secondary" font-size="10">FW</text>
  <text x="244" y="116" class="mono text-primary" font-size="10">v0.1.0</text>

  <!-- Action button -->
  <rect x="28" y="126" width="88" height="20" fill="none" stroke="#ef4444" stroke-width="1" rx="4"/>
  <text x="41" y="140" class="sans text-warn" font-size="10">Disconnect</text>

  <!-- Device 2 (disconnected) -->
  <!-- Component: <DeviceCard device={device2} selected={false} connected={false} /> -->
  <rect x="12" y="162" width="376" height="96" fill="#2a2a3e" rx="8" stroke="#3a3a4e" stroke-width="1"/>

  <circle cx="32" cy="182" r="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="44" y="186" class="sans text-primary" font-size="13" font-weight="bold">Pochi-DIO #2</text>
  <text x="284" y="186" class="sans text-low" font-size="11">Disconnected</text>

  <text x="28" y="206" class="sans text-secondary" font-size="10">UID</text>
  <text x="60" y="206" class="mono text-primary" font-size="10">9876543210FEDCBA</text>
  <text x="28" y="222" class="sans text-secondary" font-size="10">Port</text>
  <text x="60" y="222" class="mono text-primary" font-size="10">/dev/ttyACM1</text>
  <text x="220" y="222" class="sans text-secondary" font-size="10">FW</text>
  <text x="244" y="222" class="mono text-primary" font-size="10">v0.1.0</text>

  <rect x="28" y="232" width="68" height="20" fill="#7c3aed" rx="4"/>
  <text x="42" y="246" class="sans text-primary" font-size="10">Connect</text>

  <!-- Device 3 (disconnected, unassigned) -->
  <!-- Component: <DeviceCard device={device3} selected={false} connected={false} /> -->
  <rect x="12" y="268" width="376" height="96" fill="#2a2a3e" rx="8" stroke="#3a3a4e" stroke-width="1"/>

  <circle cx="32" cy="288" r="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="44" y="292" class="sans text-primary" font-size="13">Unassigned</text>
  <text x="284" y="292" class="sans text-low" font-size="11">Disconnected</text>

  <text x="28" y="312" class="sans text-secondary" font-size="10">UID</text>
  <text x="60" y="312" class="mono text-primary" font-size="10">AABBCCDD11223344</text>
  <text x="28" y="328" class="sans text-secondary" font-size="10">Port</text>
  <text x="60" y="328" class="mono text-primary" font-size="10">/dev/ttyACM2</text>
  <text x="220" y="328" class="sans text-secondary" font-size="10">FW</text>
  <text x="244" y="328" class="mono text-primary" font-size="10">v0.1.0</text>

  <rect x="28" y="338" width="68" height="20" fill="#7c3aed" rx="4"/>
  <text x="42" y="352" class="sans text-primary" font-size="10">Connect</text>

  <!-- ==================== Action Buttons ==================== -->
  <!-- Component: <DeviceActions /> -->
  <line x1="16" y1="378" x2="384" y2="378" stroke="#3a3a4e" stroke-width="1"/>
  <rect x="12" y="388" width="80" height="28" fill="#7c3aed" rx="4"/>
  <text x="26" y="406" class="sans text-primary" font-size="11">Connect</text>
  <rect x="100" y="388" width="96" height="28" fill="none" stroke="#ef4444" stroke-width="1" rx="4"/>
  <text x="114" y="406" class="sans text-warn" font-size="11">Disconnect</text>
  <rect x="204" y="388" width="72" height="28" fill="#1a1a28" rx="4" stroke="#3a3a4e" stroke-width="1"/>
  <text x="218" y="406" class="sans text-primary" font-size="11">Refresh</text>

  <!-- ==================== Device Info (Selected Device) ==================== -->
  <!-- Component: <DeviceInfoPanel device={selectedDevice} /> -->
  <line x1="16" y1="430" x2="384" y2="430" stroke="#3a3a4e" stroke-width="1"/>
  <text x="20" y="452" class="sans text-primary" font-size="13" font-weight="bold">Device Info</text>
  <text x="20" y="470" class="sans text-secondary" font-size="11">Selected: Pochi-DIO #1</text>

  <!-- Info grid -->
  <g transform="translate(20, 480)">
    <text x="0" y="14" class="sans text-secondary" font-size="11">FW Version</text>
    <text x="160" y="14" class="mono text-primary" font-size="11">v0.1.0</text>

    <text x="0" y="34" class="sans text-secondary" font-size="11">Protocol</text>
    <text x="160" y="34" class="mono text-primary" font-size="11">1</text>

    <text x="0" y="54" class="sans text-secondary" font-size="11">Capabilities</text>
    <text x="160" y="54" class="mono text-primary" font-size="11">23 DIO</text>
    <text x="160" y="70" class="mono text-primary" font-size="11">256 pattern steps</text>
    <text x="160" y="86" class="mono text-primary" font-size="11">256 TS ring</text>

    <text x="0" y="106" class="sans text-secondary" font-size="11">Sync</text>
    <text x="160" y="106" class="mono text-high" font-size="11">Supported</text>
  </g>

  <!-- ==================== Device Number Management ==================== -->
  <!-- Component: <DeviceNumberManager /> -->
  <line x1="16" y1="548" x2="384" y2="548" stroke="#3a3a4e" stroke-width="1"/>
  <text x="20" y="568" class="sans text-primary" font-size="12" font-weight="bold">Device Number</text>

  <rect x="20" y="574" width="90" height="24" fill="#7c3aed" rx="4"/>
  <text x="30" y="590" class="sans text-primary" font-size="10">Set Number</text>
  <rect x="118" y="574" width="60" height="24" fill="#1a1a28" rx="4" stroke="#3a3a4e" stroke-width="1"/>
  <text x="132" y="590" class="sans text-primary" font-size="10">Reset</text>
  <rect x="186" y="574" width="92" height="24" fill="#1a1a28" rx="4" stroke="#3a3a4e" stroke-width="1"/>
  <text x="196" y="590" class="sans text-primary" font-size="10">Auto-assign</text>
</svg>