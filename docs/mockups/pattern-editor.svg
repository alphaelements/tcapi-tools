<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .mono { font-family: 'Consolas', 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; }
      .text-primary { fill: #e2e8f0; }
      .text-secondary { fill: #94a3b8; }
      .text-accent { fill: #7c3aed; }
      .text-high { fill: #22c55e; }
      .text-low { fill: #64748b; }
      .text-warn { fill: #ef4444; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#1e1e2e"/>

  <!-- Title bar -->
  <!-- Component: <PatternEditor /> -->
  <rect x="0" y="0" width="900" height="44" fill="#2a2a3e"/>
  <text x="20" y="28" class="sans text-primary" font-size="16" font-weight="bold">Pattern Editor</text>
  <text x="680" y="28" class="sans text-secondary" font-size="12">4 steps, total 450us</text>

  <!-- ==================== Timeline View (left, ~580px) ==================== -->
  <!-- Component: <PatternTimeline steps={steps} /> -->
  <rect x="16" y="56" width="580" height="340" fill="#1a1a28" rx="6" stroke="#3a3a4e" stroke-width="1"/>

  <!-- Timeline header -->
  <text x="28" y="76" class="sans text-primary" font-size="12" font-weight="bold">Timeline</text>

  <!-- X-axis labels (time in us) -->
  <text x="80" y="382" class="mono text-secondary" font-size="9">0</text>
  <text x="184" y="382" class="mono text-secondary" font-size="9">100us</text>
  <text x="289" y="382" class="mono text-secondary" font-size="9">200us</text>
  <text x="342" y="382" class="mono text-secondary" font-size="9">250us</text>
  <text x="498" y="382" class="mono text-secondary" font-size="9">450us</text>

  <!-- Vertical grid lines -->
  <line x1="80" y1="88" x2="80" y2="370" stroke="#2a2a3e" stroke-width="0.5"/>
  <line x1="190" y1="88" x2="190" y2="370" stroke="#2a2a3e" stroke-width="0.5"/>
  <line x1="300" y1="88" x2="300" y2="370" stroke="#2a2a3e" stroke-width="0.5"/>
  <line x1="350" y1="88" x2="350" y2="370" stroke="#2a2a3e" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="505" y1="88" x2="505" y2="370" stroke="#2a2a3e" stroke-width="0.5"/>

  <!-- Channel: Out0 (bit 0) -->
  <!-- Component: <ChannelRow channel="Out0" /> -->
  <text x="28" y="128" class="mono text-primary" font-size="11">Out0</text>
  <!-- Step 1: 0x01 = bit0=HIGH, 100us -->
  <rect x="80" y="98" width="110" height="20" fill="#22c55e" fill-opacity="0.3" rx="2"/>
  <line x1="80" y1="108" x2="80" y2="128" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="80" y1="108" x2="190" y2="108" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Step 2: 0x02 = bit0=LOW, 100us -->
  <line x1="190" y1="108" x2="190" y2="128" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="190" y1="128" x2="300" y2="128" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Step 3: 0x04 = bit0=LOW, 50us -->
  <line x1="300" y1="128" x2="350" y2="128" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Step 4: 0x00 = bit0=LOW, 200us -->
  <line x1="350" y1="128" x2="505" y2="128" stroke="#22c55e" stroke-width="1.5"/>

  <!-- Channel: Out1 (bit 1) -->
  <text x="28" y="198" class="mono text-primary" font-size="11">Out1</text>
  <!-- Step 1: 0x01 = bit1=LOW -->
  <line x1="80" y1="198" x2="190" y2="198" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Step 2: 0x02 = bit1=HIGH -->
  <rect x="190" y="168" width="110" height="20" fill="#7c3aed" fill-opacity="0.3" rx="2"/>
  <line x1="190" y1="198" x2="190" y2="178" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="190" y1="178" x2="300" y2="178" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Step 3: 0x04 = bit1=LOW -->
  <line x1="300" y1="178" x2="300" y2="198" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="300" y1="198" x2="350" y2="198" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Step 4: 0x00 = bit1=LOW -->
  <line x1="350" y1="198" x2="505" y2="198" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Channel: Out2 (bit 2) -->
  <text x="28" y="268" class="mono text-primary" font-size="11">Out2</text>
  <!-- Step 1: LOW -->
  <line x1="80" y1="268" x2="190" y2="268" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Step 2: LOW -->
  <line x1="190" y1="268" x2="300" y2="268" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Step 3: 0x04 = bit2=HIGH -->
  <rect x="300" y="238" width="50" height="20" fill="#3b82f6" fill-opacity="0.3" rx="2"/>
  <line x1="300" y1="268" x2="300" y2="248" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="300" y1="248" x2="350" y2="248" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Step 4: 0x00 = bit2=LOW -->
  <line x1="350" y1="248" x2="350" y2="268" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="350" y1="268" x2="505" y2="268" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Channel: Out3 (bit 3) -->
  <text x="28" y="338" class="mono text-primary" font-size="11">Out3</text>
  <!-- All steps: bit3=LOW -->
  <line x1="80" y1="338" x2="505" y2="338" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Horizontal separator lines between channels -->
  <line x1="24" y1="148" x2="590" y2="148" stroke="#2a2a3e" stroke-width="0.5"/>
  <line x1="24" y1="218" x2="590" y2="218" stroke="#2a2a3e" stroke-width="0.5"/>
  <line x1="24" y1="288" x2="590" y2="288" stroke="#2a2a3e" stroke-width="0.5"/>
  <line x1="24" y1="358" x2="590" y2="358" stroke="#2a2a3e" stroke-width="0.5"/>

  <!-- Step boundaries (dashed vertical at transitions) -->
  <line x1="190" y1="88" x2="190" y2="370" stroke="#4a4a5e" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="300" y1="88" x2="300" y2="370" stroke="#4a4a5e" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="350" y1="88" x2="350" y2="370" stroke="#4a4a5e" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step labels at top -->
  <text x="125" y="92" class="sans text-secondary" font-size="9" text-anchor="middle">Step 1</text>
  <text x="245" y="92" class="sans text-secondary" font-size="9" text-anchor="middle">Step 2</text>
  <text x="325" y="92" class="sans text-secondary" font-size="9" text-anchor="middle">Step 3</text>
  <text x="428" y="92" class="sans text-secondary" font-size="9" text-anchor="middle">Step 4</text>

  <!-- ==================== Step List Panel (right, ~280px) ==================== -->
  <!-- Component: <StepListPanel steps={steps} /> -->
  <rect x="612" y="56" width="272" height="340" fill="#2a2a3e" rx="6"/>

  <!-- Step list header -->
  <text x="628" y="80" class="sans text-primary" font-size="12" font-weight="bold">Step List</text>

  <!-- Table header -->
  <rect x="620" y="88" width="256" height="24" fill="#1a1a28" rx="3"/>
  <text x="632" y="104" class="mono text-secondary" font-size="10">Step#</text>
  <text x="692" y="104" class="mono text-secondary" font-size="10">Output</text>
  <text x="772" y="104" class="mono text-secondary" font-size="10">Hold (us)</text>

  <!-- Step 1 (selected) -->
  <!-- Component: <StepRow step={1} selected={true} /> -->
  <rect x="620" y="114" width="256" height="28" fill="#7c3aed" fill-opacity="0.2" rx="3"/>
  <text x="640" y="132" class="mono text-primary" font-size="11">1</text>
  <text x="692" y="132" class="mono text-primary" font-size="11">0x01</text>
  <text x="780" y="132" class="mono text-primary" font-size="11">100</text>

  <!-- Step 2 -->
  <rect x="620" y="144" width="256" height="28" fill="transparent" rx="3"/>
  <text x="640" y="162" class="mono text-primary" font-size="11">2</text>
  <text x="692" y="162" class="mono text-primary" font-size="11">0x02</text>
  <text x="780" y="162" class="mono text-primary" font-size="11">100</text>

  <!-- Step 3 -->
  <rect x="620" y="174" width="256" height="28" fill="transparent" rx="3"/>
  <text x="640" y="192" class="mono text-primary" font-size="11">3</text>
  <text x="692" y="192" class="mono text-primary" font-size="11">0x04</text>
  <text x="784" y="192" class="mono text-primary" font-size="11">50</text>

  <!-- Step 4 -->
  <rect x="620" y="204" width="256" height="28" fill="transparent" rx="3"/>
  <text x="640" y="222" class="mono text-primary" font-size="11">4</text>
  <text x="692" y="222" class="mono text-primary" font-size="11">0x00</text>
  <text x="780" y="222" class="mono text-primary" font-size="11">200</text>

  <!-- Separator -->
  <line x1="628" y1="242" x2="868" y2="242" stroke="#3a3a4e" stroke-width="1"/>

  <!-- Add / Remove buttons -->
  <!-- Component: <StepActions /> -->
  <rect x="628" y="254" width="100" height="28" fill="#7c3aed" rx="4"/>
  <text x="652" y="272" class="sans text-primary" font-size="11">+ Add Step</text>
  <rect x="740" y="254" width="120" height="28" fill="none" stroke="#ef4444" stroke-width="1" rx="4"/>
  <text x="756" y="272" class="sans text-warn" font-size="11">- Remove Step</text>

  <!-- Pattern info -->
  <text x="628" y="310" class="sans text-secondary" font-size="11">Total steps: 4</text>
  <text x="628" y="330" class="sans text-secondary" font-size="11">Total duration: 450us</text>
  <text x="628" y="350" class="sans text-secondary" font-size="11">Output bits: 3 (bit 0-2)</text>
  <text x="628" y="370" class="sans text-secondary" font-size="11">Max value: 0x04</text>

  <!-- ==================== Control Bar (bottom) ==================== -->
  <!-- Component: <PatternControlBar status="idle" /> -->
  <rect x="0" y="408" width="900" height="48" fill="#2a2a3e"/>
  <line x1="0" y1="408" x2="900" y2="408" stroke="#3a3a4e" stroke-width="1"/>

  <!-- File actions -->
  <rect x="16" y="418" width="100" height="28" fill="#1a1a28" rx="4" stroke="#3a3a4e" stroke-width="1"/>
  <text x="36" y="436" class="sans text-primary" font-size="11">Load TOML</text>

  <rect x="124" y="418" width="140" height="28" fill="#7c3aed" rx="4"/>
  <text x="140" y="436" class="sans text-primary" font-size="11">Upload to Device</text>

  <!-- Separator -->
  <line x1="280" y1="418" x2="280" y2="446" stroke="#3a3a4e" stroke-width="1"/>

  <!-- Playback controls -->
  <rect x="296" y="418" width="90" height="28" fill="#22c55e" fill-opacity="0.2" rx="4" stroke="#22c55e" stroke-width="1"/>
  <text x="311" y="436" class="sans text-high" font-size="11">&#x25B6; Run Once</text>

  <rect x="394" y="418" width="72" height="28" fill="#1a1a28" rx="4" stroke="#3a3a4e" stroke-width="1"/>
  <text x="409" y="436" class="sans text-primary" font-size="11">&#x1F501; Loop</text>

  <rect x="474" y="418" width="64" height="28" fill="#1a1a28" rx="4" stroke="#3a3a4e" stroke-width="1"/>
  <text x="489" y="436" class="sans text-primary" font-size="11">&#x23F9; Stop</text>

  <!-- Separator -->
  <line x1="554" y1="418" x2="554" y2="446" stroke="#3a3a4e" stroke-width="1"/>

  <!-- Status -->
  <text x="570" y="436" class="sans text-secondary" font-size="12">Status:</text>
  <text x="622" y="436" class="mono text-primary" font-size="12">Idle</text>

  <!-- Bottom info bar -->
  <!-- Component: <PatternInfoBar /> -->
  <rect x="0" y="458" width="900" height="42" fill="#1e1e2e"/>
  <line x1="0" y1="458" x2="900" y2="458" stroke="#3a3a4e" stroke-width="1"/>
  <text x="16" y="484" class="sans text-secondary" font-size="11">Pattern: 4 steps | 450us total | Output mask: 0x00000007 (bits 0-2) | Sequence: 0x01 &gt; 0x02 &gt; 0x04 &gt; 0x00</text>
</svg>