# Pull-up and pull-down requested together. A pin has a single `pull`
# setting by design, so the device-level conflict (pull_up_mask and
# pull_down_mask sharing a bit) cannot be written as a valid map; the
# array form below is rejected.
# expected_error: GP4: pull must be "up", "down" or "none"
version = 2

[pins]
GP4 = { dir = "in", pull = ["up", "down"] }
