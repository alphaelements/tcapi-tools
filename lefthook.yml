pre-commit:
  parallel: false
  commands:
    rust-fmt:
      glob: "**/*.rs"
      run: cargo fmt --all -- --check
      fail_text: "rustfmt failed. Run 'cargo fmt --all' to fix."

    rust-clippy:
      glob: "**/*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings
      fail_text: "clippy warnings found. Fix all warnings before committing."

    rust-test:
      glob: "**/*.rs"
      run: cargo test --workspace
      fail_text: "Rust tests failed. All tests must pass before committing."

    no-todo:
      glob: "**/*.rs"
      run: |
        if grep -rn 'todo!()' sdk/rust/src/ gui/src-tauri/src/ 2>/dev/null || \
           grep -rn 'unimplemented!()' sdk/rust/src/ gui/src-tauri/src/ 2>/dev/null; then
          echo "ERROR: todo!() or unimplemented!() found."
          exit 1
        fi
      fail_text: "todo!() or unimplemented!() found. Complete implementation before committing."

    no-allow-dead-code:
      glob: "**/*.rs"
      run: |
        if grep -rn '#\[allow(dead_code)\]' sdk/rust/src/ gui/src-tauri/src/ 2>/dev/null; then
          echo "ERROR: #[allow(dead_code)] found."
          exit 1
        fi
      fail_text: "#[allow(dead_code)] found. Remove dead code or complete it."

    no-main-commit:
      run: |
        BRANCH=$(git branch --show-current)
        if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
          echo "ERROR: Direct commits to $BRANCH are prohibited."
          echo "Create a feature branch first."
          exit 1
        fi
      fail_text: "Direct commits to main/master are prohibited."

    no-internal-urls:
      run: |
        MATCHES=$(grep -rn 'gitlab\.home\|gitlab\.home:8888' \
          --include='*.rs' --include='*.ts' --include='*.tsx' \
          --include='*.py' --include='*.cs' --include='*.md' \
          --include='*.toml' --include='*.json' --include='*.yml' --include='*.yaml' \
          . 2>/dev/null \
          | grep -v '\.gitignore' | grep -v 'CLAUDE\.md' | grep -v '\.claude/' | grep -v '/tmp/' | grep -v 'node_modules/' | grep -v '/target/' \
          | grep -v '\.venv/' | grep -v '/dist/' || true)
        if [ -n "$MATCHES" ]; then
          echo "$MATCHES"
          echo "ERROR: Internal URL found in committed files. This is a public repo."
          exit 1
        fi
      fail_text: "Internal URLs detected. Remove before committing to public repo."

    no-personal-info:
      run: |
        if [ -f .public-repo-deny-patterns ]; then
          PATTERN=$(paste -sd'|' .public-repo-deny-patterns)
          MATCHES=$(grep -rniE "$PATTERN" \
            --include='*.rs' --include='*.ts' --include='*.tsx' \
            --include='*.py' --include='*.cs' --include='*.md' \
            --include='*.toml' --include='*.json' --include='*.yml' --include='*.yaml' \
            . 2>/dev/null \
            | grep -v '\.gitignore' | grep -v 'CLAUDE\.md' | grep -v '\.claude/' | grep -v '/tmp/' \
            | grep -v '\.public-repo-deny-patterns' | grep -v 'node_modules/' | grep -v '/target/' \
            | grep -v '\.venv/' | grep -v '/dist/' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "ERROR: Denied pattern found in committed files. This is a public repo."
            exit 1
          fi
        fi
      fail_text: "Denied pattern detected. Remove before committing to public repo."

    ts-typecheck:
      glob: "gui/src/**/*.{ts,tsx}"
      run: |
        if [ -f gui/package.json ] && [ -d gui/node_modules ]; then
          cd gui && npx tsc --noEmit
        fi
      fail_text: "TypeScript type checking failed."

pre-push:
  parallel: false
  commands:
    full-test:
      run: cargo test --workspace
      fail_text: "Tests failed. All tests must pass before pushing."

    full-clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
      fail_text: "clippy warnings found."

    fmt-check:
      run: cargo fmt --all -- --check
      fail_text: "rustfmt failed."
