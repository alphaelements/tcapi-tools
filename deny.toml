# cargo-deny configuration (schema for cargo-deny >= 0.14, "version 2").
# Vulnerabilities, unmaintained crates, and unlicensed crates are denied
# by default in version 2 — no explicit keys needed.

[advisories]
version = 2
yanked = "warn"
# All entries below are "unmaintained" notices (not vulnerabilities) pulled
# in by the Tauri v2 dependency tree on Linux; they cannot be fixed here.
# Revisit when Tauri moves off GTK3 (tauri-apps/tauri#9662).
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via tauri macros (unmaintained, no vuln)" },
    { id = "RUSTSEC-2024-0411", reason = "GTK3 bindings via tauri/wry on Linux (unmaintained, no vuln)" },
    { id = "RUSTSEC-2024-0412", reason = "GTK3 bindings via tauri/wry on Linux (unmaintained, no vuln)" },
    { id = "RUSTSEC-2024-0413", reason = "GTK3 bindings via tauri/wry on Linux (unmaintained, no vuln)" },
    { id = "RUSTSEC-2024-0414", reason = "GTK3 bindings via tauri/wry on Linux (unmaintained, no vuln)" },
    { id = "RUSTSEC-2024-0415", reason = "GTK3 bindings via tauri/wry on Linux (unmaintained, no vuln)" },
    { id = "RUSTSEC-2024-0416", reason = "GTK3 bindings via tauri/wry on Linux (unmaintained, no vuln)" },
    { id = "RUSTSEC-2024-0417", reason = "GTK3 bindings via tauri/wry on Linux (unmaintained, no vuln)" },
    { id = "RUSTSEC-2024-0418", reason = "GTK3 bindings via tauri/wry on Linux (unmaintained, no vuln)" },
    { id = "RUSTSEC-2024-0419", reason = "GTK3 bindings via tauri/wry on Linux (unmaintained, no vuln)" },
    { id = "RUSTSEC-2024-0420", reason = "GTK3 bindings via tauri/wry on Linux (unmaintained, no vuln)" },
    { id = "RUSTSEC-2025-0075", reason = "unic-* via tauri config parsing (unmaintained, no vuln)" },
    { id = "RUSTSEC-2025-0080", reason = "unic-* via tauri config parsing (unmaintained, no vuln)" },
    { id = "RUSTSEC-2025-0081", reason = "unic-* via tauri config parsing (unmaintained, no vuln)" },
    { id = "RUSTSEC-2025-0098", reason = "unic-* via tauri config parsing (unmaintained, no vuln)" },
    { id = "RUSTSEC-2025-0100", reason = "unic-* via tauri config parsing (unmaintained, no vuln)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "MPL-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies (e.g. pochi-gui -> pochi-sdk) carry
# no version; that is not the supply-chain wildcard this lint targets.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
