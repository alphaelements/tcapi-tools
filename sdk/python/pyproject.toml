[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pochi-sdk"
version = "0.1.0"
description = "Python SDK for Pochi-DIO (RP2350 high-speed digital I/O unit)"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    # TOML parsing for safety.toml; the standard library has it from 3.11.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# scripts/ holds hardware tools (some named test_*.py) that need real devices.
testpaths = ["tests"]
