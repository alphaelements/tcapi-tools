[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pochi-sdk"
version = "0.1.0"
description = "Python SDK for Pochi-DIO (RP2350 high-speed digital I/O unit)"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
